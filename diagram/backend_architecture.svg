<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <!-- Arrowhead Markers -->
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 30)">
    <text font-size="18" font-weight="700" fill="#f8fafc" x="0" y="0">System Architecture: General Backend &amp; Data Flow</text>
    <text font-size="10" font-weight="400" fill="#94a3b8" x="0" y="18">How requests, authentication, caching, queues, business logic, and databases travel in modern backends</text>
  </g>

  <!-- Regions / Boundaries -->
  <!-- Client Zone -->
  <rect x="40" y="90" width="180" height="580" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="55" y="112" fill="#22d3ee" font-size="10" font-weight="600">CLIENT LAYER</text>

  <!-- Edge & Gateway Zone -->
  <rect x="250" y="90" width="200" height="580" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="265" y="112" fill="#fbbf24" font-size="10" font-weight="600">EDGE &amp; GATEWAY</text>

  <!-- Application Services Zone -->
  <rect x="480" y="90" width="230" height="580" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="495" y="112" fill="#34d399" font-size="10" font-weight="600">APP SERVICES &amp; WORKERS</text>

  <!-- Middleware & Async Queue Zone -->
  <rect x="740" y="90" width="180" height="580" rx="12" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="755" y="112" fill="#fb923c" font-size="10" font-weight="600">CACHE &amp; MESSAGE QUEUE</text>

  <!-- Data Persistence Zone -->
  <rect x="950" y="90" width="210" height="580" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="965" y="112" fill="#a78bfa" font-size="10" font-weight="600">DATA &amp; PERSISTENCE</text>

  <!-- Connections / Arrows Layer -->
  <!-- 1. Client to CDN/Gateway -->
  <path d="M 190 200 L 270 200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="230" y="192" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">1. HTTPS Request</text>

  <path d="M 190 420 L 270 200" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-cyan)"/>

  <!-- 2. Gateway to Auth / Load Balancer -->
  <path d="M 430 200 L 500 200" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="465" y="192" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">2. Route &amp; Auth</text>

  <!-- 3. App Service to Cache -->
  <path d="M 660 180 L 760 180" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="710" y="172" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">3. Cache Lookaside</text>

  <!-- 4. App Service to Database -->
  <path d="M 660 220 L 740 220 L 740 330 L 970 330" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="850" y="322" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">4. SQL Query / Mutation</text>

  <!-- 5. App Service to Async Queue -->
  <path d="M 660 240 L 760 420" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="700" y="340" fill="#fb923c" font-size="8" font-weight="600" text-anchor="middle">5. Async Task Event</text>

  <!-- 6. Queue to Background Worker -->
  <path d="M 760 440 L 660 480" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="715" y="475" fill="#fb923c" font-size="8" font-weight="600" text-anchor="middle">6. Consume Job</text>

  <!-- 7. Background Worker to S3 / Vector DB -->
  <path d="M 660 500 L 970 500" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="850" y="492" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">7. Bulk File / Embedding Write</text>

  <!-- 8. Return Response Stream to Client -->
  <path d="M 500 240 L 430 240 L 430 420 L 190 420" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-cyan)"/>
  <text x="310" y="435" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">8. Response Stream (JSON/SSE)</text>


  <!-- Components Boxes (Mask + Styled Rect) -->
  
  <!-- COLUMN 1: CLIENTS -->
  <!-- Web Browser -->
  <rect x="60" y="160" width="140" height="70" rx="8" fill="#0f172a"/>
  <rect x="60" y="160" width="140" height="70" rx="8" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Web App (React/Vite)</text>
  <text x="130" y="210" fill="#94a3b8" font-size="8" text-anchor="middle">HTTPS / REST / WS</text>

  <!-- Mobile Client -->
  <rect x="60" y="380" width="140" height="70" rx="8" fill="#0f172a"/>
  <rect x="60" y="380" width="140" height="70" rx="8" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="410" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Mobile / IoT App</text>
  <text x="130" y="430" fill="#94a3b8" font-size="8" text-anchor="middle">iOS / Android / SDK</text>

  <!-- COLUMN 2: EDGE & GATEWAY -->
  <!-- CDN & Cloudflare -->
  <rect x="270" y="160" width="160" height="70" rx="8" fill="#0f172a"/>
  <rect x="270" y="160" width="160" height="70" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="350" y="188" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">API Gateway &amp; WAF</text>
  <text x="350" y="205" fill="#94a3b8" font-size="8" text-anchor="middle">Kong / Nginx / Reverse Proxy</text>
  <text x="350" y="218" fill="#fbbf24" font-size="7" text-anchor="middle">Rate Limit • SSL • JWT Check</text>

  <!-- Auth Service -->
  <rect x="270" y="380" width="160" height="70" rx="8" fill="#0f172a"/>
  <rect x="270" y="380" width="160" height="70" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="350" y="410" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Auth &amp; IAM Provider</text>
  <text x="350" y="430" fill="#94a3b8" font-size="8" text-anchor="middle">OAuth2 / OIDC / Supabase Auth</text>

  <!-- COLUMN 3: APP SERVICES -->
  <!-- API Server / Core Service -->
  <rect x="500" y="160" width="160" height="90" rx="8" fill="#0f172a"/>
  <rect x="500" y="160" width="160" height="90" rx="8" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.5"/>
  <text x="580" y="188" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Core API Service</text>
  <text x="580" y="205" fill="#94a3b8" font-size="8" text-anchor="middle">FastAPI / Node / Spring</text>
  <text x="580" y="222" fill="#34d399" font-size="8" text-anchor="middle">Business Logic &amp; ORM</text>

  <!-- Background Worker -->
  <rect x="500" y="440" width="160" height="80" rx="8" fill="#0f172a"/>
  <rect x="500" y="440" width="160" height="80" rx="8" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.5"/>
  <text x="580" y="470" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Async Task Worker</text>
  <text x="580" y="490" fill="#94a3b8" font-size="8" text-anchor="middle">Celery / BullMQ / Python Worker</text>

  <!-- COLUMN 4: CACHE & QUEUE -->
  <!-- Redis Cache -->
  <g transform="translate(760, 150)">
    <rect x="0" y="10" width="140" height="50" rx="4" fill="#0f172a"/>
    <rect x="0" y="10" width="140" height="50" rx="4" fill="rgba(120, 53, 15, 0.4)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="70" y="32" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Redis In-Memory</text>
    <text x="70" y="48" fill="#94a3b8" font-size="8" text-anchor="middle">Session / Read Cache</text>
  </g>

  <!-- Message Broker / Queue -->
  <g transform="translate(760, 390)">
    <rect x="0" y="10" width="140" height="60" rx="4" fill="#0f172a"/>
    <rect x="0" y="10" width="140" height="60" rx="4" fill="rgba(120, 53, 15, 0.4)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="70" y="35" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Kafka / RabbitMQ</text>
    <text x="70" y="52" fill="#94a3b8" font-size="8" text-anchor="middle">Event Streaming Bus</text>
  </g>

  <!-- COLUMN 5: DATA & STORAGE -->
  <!-- Relational DB Cylinder -->
  <g transform="translate(970, 290)">
    <rect x="0" y="10" width="160" height="60" rx="2" fill="#0f172a"/>
    <ellipse cx="80" cy="10" rx="80" ry="14" fill="#0f172a"/>
    <ellipse cx="80" cy="70" rx="80" ry="14" fill="#0f172a"/>
    <rect x="0" y="10" width="160" height="60" fill="rgba(76, 29, 149, 0.4)"/>
    <ellipse cx="80" cy="10" rx="80" ry="14" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="80" cy="70" rx="80" ry="14" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="160" y1="10" x2="160" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="80" y="42" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL / MySQL</text>
    <text x="80" y="58" fill="#94a3b8" font-size="8" text-anchor="middle">ACID Relational Storage</text>
  </g>

  <!-- Object Storage / Vector DB -->
  <g transform="translate(970, 460)">
    <rect x="0" y="10" width="160" height="60" rx="2" fill="#0f172a"/>
    <ellipse cx="80" cy="10" rx="80" ry="14" fill="#0f172a"/>
    <ellipse cx="80" cy="70" rx="80" ry="14" fill="#0f172a"/>
    <rect x="0" y="10" width="160" height="60" fill="rgba(76, 29, 149, 0.4)"/>
    <ellipse cx="80" cy="10" rx="80" ry="14" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="80" cy="70" rx="80" ry="14" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="160" y1="10" x2="160" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="80" y="42" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">S3 Bucket / Vector DB</text>
    <text x="80" y="58" fill="#94a3b8" font-size="8" text-anchor="middle">Unstructured Data &amp; Media</text>
  </g>

  <!-- Legend at Bottom -->
  <g transform="translate(40, 700)">
    <rect x="0" y="0" width="1120" height="50" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-size="10" font-weight="600">LEGEND:</text>
    
    <rect x="90" y="18" width="14" height="14" rx="3" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="112" y="30" fill="#94a3b8" font-size="9">Client / Frontend</text>

    <rect x="250" y="18" width="14" height="14" rx="3" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="272" y="30" fill="#94a3b8" font-size="9">Gateway &amp; Security</text>

    <rect x="420" y="18" width="14" height="14" rx="3" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.5"/>
    <text x="442" y="30" fill="#94a3b8" font-size="9">Application Services</text>

    <rect x="600" y="18" width="14" height="14" rx="3" fill="rgba(120, 53, 15, 0.4)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="622" y="30" fill="#94a3b8" font-size="9">Cache &amp; Event Queue</text>

    <rect x="800" y="18" width="14" height="14" rx="3" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="822" y="30" fill="#94a3b8" font-size="9">Databases &amp; Storage</text>
  </g>
</svg>